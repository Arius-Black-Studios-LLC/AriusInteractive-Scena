<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Confirm your new Arleco email</title>
</head>
<body style="margin:0;padding:0;background:#f7f6f3;font-family:Georgia,'Times New Roman',serif;color:#1a0a0e;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f7f6f3;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;width:100%;background:#ffffff;border:1px solid #e8cfd4;border-radius:14px;overflow:hidden;">
          <tr>
            <td style="background:#7c1128;padding:20px 28px;">
              <table role="presentation" cellspacing="0" cellpadding="0" width="100%">
                <tr>
                  <td width="72" valign="middle" style="padding-right:16px;">
                    <img src="https://arleco.app/arleco-icon.png" width="56" height="56" alt="Arleco" style="display:block;border:0;width:56px;height:56px;border-radius:12px;" />
                  </td>
                  <td valign="middle">
                    <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:#f0d78c;font-weight:700;">Arleco</p>
                    <h1 style="margin:6px 0 0;font-size:28px;line-height:1.2;color:#ffffff;">Confirm email change</h1>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;">
              <p style="margin:0 0 16px;font-size:17px;line-height:1.55;">Confirm this address to finish updating your Arleco account email{{ if .NewEmail }} to <strong>{{ .NewEmail }}</strong>{{ end }}.</p>
              <p style="margin:0 0 28px;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#7c1128;color:#ffffff;text-decoration:none;font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:16px;padding:14px 22px;border-radius:999px;">Confirm new email</a>
              </p>
              <p style="margin:0;font-size:14px;line-height:1.5;color:#5a4a4e;">If the button doesn’t work, <a href="{{ .ConfirmationURL }}" style="color:#7c1128;font-weight:700;">click here</a> instead.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px 24px;border-top:1px solid #f0e4e7;">
              <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#8a7a7e;">Arleco · Arius Interactive · <a href="https://arleco.app/" style="color:#7c1128;">arleco.app</a></p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
