<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/arleco-icon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <title>Arleco — Human-made stories you choose</title>
  </head>
  <body>
    <!-- Netlify Forms: Arleco contact (brand tag [Arleco]) -->
    <form name="contact-arleco" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="brand" />
      <input name="subject" />
      <input name="name" />
      <input name="email" />
      <input name="topic" />
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
